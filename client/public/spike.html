<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MOVA · ASR Spike (keyword spotting)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #0c1020; color: #e8ecf6; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 14px;
  }
  h1 { font-size: 15px; letter-spacing: .5px; opacity: .6; margin: 0; font-weight: 600; text-transform: uppercase; }
  .panel { width: 100%; max-width: 560px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 16px;
    background: #1e2740; color: #e8ecf6; cursor: pointer; flex: 1; min-width: 90px;
  }
  button.primary { background: #3b82f6; color: #fff; }
  button.on { background: #22c55e; color: #06210f; }
  button:disabled { opacity: .4; }
  .lang.active { background: #6366f1; color: #fff; }
  input[type=text] {
    width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #2b3757; background: #131a2e; color: #e8ecf6;
  }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; opacity: .5; }
  #stage {
    width: 100%; max-width: 560px; min-height: 190px; border-radius: 22px;
    background: radial-gradient(120% 120% at 50% 0%, #16203c 0%, #0e1428 100%);
    border: 1px solid #24304f; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; padding: 18px; text-align: center;
    transition: background .12s, border-color .12s;
  }
  #stage.hit { background: radial-gradient(120% 120% at 50% 0%, #14532d 0%, #0e2a18 100%); border-color: #22c55e; }
  #word { font-size: 56px; font-weight: 800; line-height: 1.05; min-height: 60px; word-break: break-word; }
  #latency { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #latency small { font-size: 16px; font-weight: 600; opacity: .6; }
  #partial { font-size: 15px; opacity: .55; min-height: 20px; font-family: ui-monospace, monospace; }
  #status { font-size: 13px; opacity: .7; min-height: 18px; text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 560px; }
  .stat { background: #131a2e; border: 1px solid #232f4d; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; opacity: .5; }
  #log { width: 100%; max-width: 560px; font-family: ui-monospace, monospace; font-size: 12px; }
  #log div { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #1a2440; }
  #log div span:last-child { opacity: .6; }
  .miss { color: #f59e0b; }
  .amp { width: 100%; max-width: 560px; height: 6px; background: #131a2e; border-radius: 4px; overflow: hidden; }
  .amp > i { display: block; height: 100%; width: 0%; background: #22c55e; transition: width .05s; }
</style>
</head>
<body>
  <h1>MOVA · ASR Spike — on-device keyword spotting</h1>

  <div class="panel row">
    <button class="lang active" data-lang="ru" data-model="/models/vosk-model-small-ru-0.22.tar.gz">Русский</button>
    <button class="lang" data-lang="es" data-model="/models/vosk-model-small-es-0.42.tar.gz">Español</button>
  </div>

  <div class="panel">
    <label>Target words (the level's tiny vocab — space separated, lowercase)</label>
    <input id="words" type="text" value="прыгай беги стой влево вправо" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </div>

  <div class="panel row">
    <button id="start" class="primary">▶︎ Load model &amp; listen</button>
    <button id="reset">Reset stats</button>
  </div>

  <div class="amp"><i id="amp"></i></div>

  <div id="stage">
    <div id="word">…</div>
    <div id="latency"><small>waiting</small></div>
  </div>
  <div id="partial"></div>
  <div id="status">Tap “Load model &amp; listen”. First load downloads ~46 MB (cached after).</div>

  <div class="stats">
    <div class="stat"><b id="s-count">0</b><span>utterances</span></div>
    <div class="stat"><b id="s-avg">–</b><span>avg ms</span></div>
    <div class="stat"><b id="s-p50">–</b><span>median ms</span></div>
    <div class="stat"><b id="s-max">–</b><span>max ms</span></div>
  </div>

  <div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), stageEl = $("stage"), wordEl = $("word"),
        latEl = $("latency"), partialEl = $("partial"), ampEl = $("amp"), logEl = $("log");

  let currentModelUrl = document.querySelector(".lang.active").dataset.model;
  let model = null, recognizer = null, audioCtx = null, node = null, sourceNode = null, stream = null;
  let grammar = [];
  const latencies = [];

  // --- speech onset tracking (for "spoke → detected" latency) ---
  let speaking = false, onsetTime = 0, matchedThisUtterance = false, quietFrames = 0;
  const ON = 0.018, OFF = 0.010, QUIET_FRAMES_TO_END = 8; // ~ (8*4096/48000)≈0.7s silence ends an utterance

  function setStatus(t) { statusEl.textContent = t; }

  function parseWords() {
    return $("words").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function beep(ok) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 880 : 300; o.type = "sine";
    g.gain.value = 0.0001; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.start(t); o.stop(t + 0.2);
  }

  function renderStats() {
    $("s-count").textContent = latencies.length;
    if (!latencies.length) { $("s-avg").textContent = $("s-p50").textContent = $("s-max").textContent = "–"; return; }
    const sorted = [...latencies].sort((a,b)=>a-b);
    const avg = Math.round(latencies.reduce((a,b)=>a+b,0)/latencies.length);
    $("s-avg").textContent = avg;
    $("s-p50").textContent = sorted[Math.floor(sorted.length/2)];
    $("s-max").textContent = sorted[sorted.length-1];
  }

  function logHit(word, ms, hit) {
    latencies.push(ms);
    const d = document.createElement("div");
    d.innerHTML = `<span class="${hit ? "" : "miss"}">${hit ? "✓" : "?"} ${word || "(unclear)"}</span><span>${ms} ms</span>`;
    logEl.insertBefore(d, logEl.firstChild);
    while (logEl.childElementCount > 40) logEl.removeChild(logEl.lastChild);
    renderStats();
  }

  function flashMatch(word, ms, hit) {
    wordEl.textContent = word || "(unclear)";
    wordEl.style.color = hit ? "#4ade80" : "#f59e0b";
    latEl.innerHTML = ms + ' <small>ms</small>';
    stageEl.classList.add("hit");
    setTimeout(() => stageEl.classList.remove("hit"), 220);
    beep(hit);
    logHit(word, ms, hit);
  }

  // pick the first grammar word appearing in a recognized string
  function firstTarget(text) {
    if (!text) return null;
    const toks = text.toLowerCase().split(/\s+/);
    for (const t of toks) if (grammar.includes(t)) return t;
    return null;
  }

  async function buildRecognizer() {
    grammar = parseWords();
    if (recognizer) { try { recognizer.remove(); } catch(_){} recognizer = null; }
    const sr = audioCtx.sampleRate;
    recognizer = new model.KaldiRecognizer(sr, JSON.stringify([...grammar, "[unk]"]));
    recognizer.setWords(true);

    recognizer.on("partialresult", (m) => {
      const p = (m.result && m.result.partial) || "";
      partialEl.textContent = p;
      if (!matchedThisUtterance && speaking) {
        const w = firstTarget(p);
        if (w) {
          matchedThisUtterance = true;
          flashMatch(w, Math.round(performance.now() - onsetTime), true);
        }
      }
    });

    recognizer.on("result", (m) => {
      const text = (m.result && m.result.text) || "";
      partialEl.textContent = "";
      if (!matchedThisUtterance) {
        // partial never surfaced a target; judge on the final transcript
        const w = firstTarget(text);
        const ms = Math.round(performance.now() - onsetTime);
        if (w) flashMatch(w, ms, true);
        else if (text) flashMatch(text, ms, false); // heard something, not in grammar → accuracy miss
      }
    });
    setStatus(`Listening · grammar = [ ${grammar.join(", ")} ]  ·  say a word`);
  }

  async function start() {
    const btn = $("start");
    btn.disabled = true;
    try {
      if (!window.Vosk) throw new Error("vosk-browser failed to load from CDN");
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      if (!model || model.__url !== currentModelUrl) {
        setStatus("Downloading + unpacking model… (first time ~46 MB)");
        if (model) { try { model.terminate(); } catch(_){} }
        model = await Vosk.createModel(currentModelUrl);
        model.__url = currentModelUrl;
      }

      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }, video: false,
        });
        sourceNode = audioCtx.createMediaStreamSource(stream);
        node = audioCtx.createScriptProcessor(4096, 1, 1);
        node.onaudioprocess = (e) => {
          const buf = e.inputBuffer.getChannelData(0);
          // RMS for onset/endpoint + amp meter
          let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i]*buf[i];
          const rms = Math.sqrt(sum / buf.length);
          ampEl.style.width = Math.min(100, rms * 900) + "%";
          if (!speaking && rms > ON) {
            speaking = true; matchedThisUtterance = false; quietFrames = 0;
            onsetTime = performance.now();
          } else if (speaking) {
            if (rms < OFF) { if (++quietFrames >= QUIET_FRAMES_TO_END) speaking = false; }
            else quietFrames = 0;
          }
          if (recognizer) { try { recognizer.acceptWaveform(e.inputBuffer); } catch(_){} }
        };
        sourceNode.connect(node);
        node.connect(audioCtx.destination); // Safari needs the node in the graph
      }

      await buildRecognizer();
      btn.textContent = "● listening"; btn.classList.add("on");
      wordEl.textContent = "say it →"; latEl.innerHTML = '<small>ready</small>';
    } catch (err) {
      setStatus("Error: " + (err && err.message || err));
      btn.disabled = false;
    }
  }

  // rebuild recognizer when the word list changes (debounced)
  let wt;
  $("words").addEventListener("input", () => {
    clearTimeout(wt);
    wt = setTimeout(() => { if (recognizer && model) buildRecognizer(); }, 500);
  });

  $("start").addEventListener("click", start);
  $("reset").addEventListener("click", () => {
    latencies.length = 0; logEl.innerHTML = ""; renderStats();
    wordEl.textContent = "…"; latEl.innerHTML = '<small>waiting</small>';
  });

  document.querySelectorAll(".lang").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".lang").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentModelUrl = b.dataset.model;
    $("words").value = b.dataset.lang === "es"
      ? "salta corre alto izquierda derecha"
      : "прыгай беги стой влево вправо";
    if (model) { setStatus("Language changed — tap “Load model & listen” to load " + b.textContent + "."); }
  }));
})();
</script>
</body>
</html>
